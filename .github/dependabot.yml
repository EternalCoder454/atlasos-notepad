# Weekly pull requests for the dependencies Notepad builds with. (No docker
# entry: Dependabot reads Dockerfiles, and ci/Containerfile is not one.) Nothing is
# merged by itself: CI (and the security workflow) must pass, and a person
# reads the change.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # atlas-framework is pinned by commit, together with `telamon-ui >=` in
      # the spec and the image CI builds (CLAUDE.md, "Moving the pin"): it is
      # moved by hand, not by a bot.
      - dependency-name: "telamon-framework-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
