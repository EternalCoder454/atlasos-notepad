name: CI

on:
  push:
    branches: [main]
    paths-ignore: &ignored
      - '**.md'
      - 'docs/**'
      - 'out/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:
  # Monday 03:00 UTC: runs only the image job, so the week's tag exists on
  # GHCR before pull requests need it.
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

# A new push cancels the older run of a branch or pull request, never a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/eternalcoder454/atlas-notepad-dev

# Everything runs in Fedora 44, the release AtlasOS is built on, as scripts/dev.sh
# does locally. Actions are pinned by commit.
#
#   image -> lint, check, rpm   (in parallel; prune after image on main)
#
# `image` makes sure the build image exists on GHCR (building it, with Atlas.Ui,
# only when its inputs changed), so no job installs packages. `lint` fails fast.

jobs:
  # The trusted tag f44-<hash> is a hash of everything the image is made from:
  # the spec (build dependencies), the atlas-framework rev (Atlas.Ui), ci/ and
  # the ISO week (Fedora's updates). Only a run on main (push, dispatch,
  # schedule) may push it, so a branch can never plant an image main reuses.
  # Any run reuses an existing trusted tag. If it is missing, a run on main
  # builds it; a same-repository run elsewhere builds and pushes
  # untrusted-<hash>-<run id> for its own jobs.
  #
  # Fork pull requests and Dependabot have a read-only token and cannot push.
  # If the trusted image is missing for them, this job fails with a message; a
  # maintainer re-runs CI from a branch of this repository. The package must be
  # public, so those jobs can still pull an image that exists.
  image:
    name: build image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      trusted: ${{ steps.plan.outputs.trusted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same rev as the crates, so Atlas.Ui and the crash code match.
      - name: Read the atlas-framework rev and compute the tag
        id: tag
        run: |
          url='https://github.com/EternalCoder454/atlas-framework'
          revs=$(sed -n "s|^atlas-framework-[a-z]* = { git = \"$url\", rev = \"\([0-9a-f]\{40\}\)\" }\$|\1|p" Cargo.toml | sort -u)
          crates=$(grep -c '^atlas-framework-' Cargo.toml || true)
          pinned=$(grep -c "^atlas-framework-[a-z]* = { git = \"$url\", rev = \"[0-9a-f]\{40\}\" }\$" Cargo.toml || true)
          if [ "$crates" = 0 ] || [ "$pinned" != "$crates" ] || [ "$(printf '%s\n' "$revs" | wc -l)" != 1 ]; then
            echo "Cargo.toml must pin every atlas-framework crate to $url at one 40-character rev" >&2
            exit 1
          fi
          # No second pin elsewhere: member crates must use `.workspace = true`.
          if find . -name Cargo.toml -not -path ./Cargo.toml -not -path './target/*' -not -path './build/*' -print0 \
              | xargs -0 -r grep -nE 'atlas-framework.*git *=|git *= *"[^"]*atlas-framework'; then
            echo "Only the root Cargo.toml may name the atlas-framework git source; use .workspace = true" >&2
            exit 1
          fi
          week=$(date -u +%G-W%V)
          sum=$({ printf '%s\n%s\n' "$revs" "$week"; cat packaging/atlas-notepad.spec; find ci -type f | LC_ALL=C sort | xargs cat; } | sha256sum | cut -c1-16)
          {
            echo "rev=$revs"
            echo "week=$week"
            echo "sum=$sum"
          } >>"$GITHUB_OUTPUT"

      # Decides the tag and whether to build. The token is used for the
      # existence check only, and logged out again; the login for the push is
      # a separate step just before it.
      - name: Does the image exist?
        id: plan
        env:
          SUM: ${{ steps.tag.outputs.sum }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          TRUSTED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          CAN_PUSH: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && github.actor != 'dependabot[bot]' }}
        run: |
          trusted_ref="$IMAGE:f44-$SUM"
          if [ "$CAN_PUSH" = true ]; then
            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
            trap 'docker logout ghcr.io >/dev/null' EXIT
          fi
          if err=$(docker manifest inspect "$trusted_ref" 2>&1 >/dev/null); then
            echo "$trusted_ref exists"
            tag="f44-$SUM"; build=false
          elif printf '%s' "$err" | grep -qiE 'manifest unknown|no such manifest|not found'; then
            echo "$trusted_ref is missing"
            if [ "$CAN_PUSH" != true ]; then
              echo "::error::The build image $trusted_ref does not exist yet and this run's token cannot push it (fork or Dependabot). A maintainer must re-run CI from a branch of $GITHUB_REPOSITORY."
              exit 1
            fi
            build=true
            if [ "$TRUSTED" = true ]; then tag="f44-$SUM"; else tag="untrusted-$SUM-$RUN_ID"; fi
          else
            printf '%s\n' "$err" >&2
            echo "::error::Could not look up $trusted_ref (above). If the package is private, make it public after the first push and give this repository Actions access to it."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "build=$build"
            echo "trusted=$TRUSTED"
          } >>"$GITHUB_OUTPUT"
          echo "using $IMAGE:$tag (build: $build)"

      # atlas-framework's RPMs, once per rev and week (also when only the spec
      # changed and the image is rebuilt).
      - name: Cache the RPMs
        id: cache
        if: steps.plan.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: framework-rpms
          key: atlas-framework-rpms-f44-${{ steps.tag.outputs.rev }}-${{ steps.tag.outputs.week }}

      - name: Check out atlas-framework
        if: steps.plan.outputs.build == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EternalCoder454/atlas-framework
          ref: ${{ steps.tag.outputs.rev }}
          path: atlas-framework
          persist-credentials: false

      # In a Fedora container, as its build-rpm.sh installs packages as root.
      - name: Build the RPMs
        if: steps.plan.outputs.build == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir framework-rpms
          docker run --rm \
            -v "$PWD/atlas-framework":/src:ro \
            -v "$PWD/framework-rpms":/out \
            registry.fedoraproject.org/fedora:44 \
            /src/packaging/build-rpm.sh /out
          ls -l framework-rpms

      - name: Log in to GHCR to push
        if: steps.plan.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Containerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.plan.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Keeps the newest versions of the package: 6 trusted ones, 3 untrusted.
  # Best effort: a failure here must not fail CI.
  prune:
    name: prune old images
    needs: image
    if: needs.image.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prune untrusted-* versions
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: atlas-notepad-dev
          package-type: container
          min-versions-to-keep: 3
          ignore-versions: '^(?!untrusted-).*$'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old f44-* versions
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: atlas-notepad-dev
          package-type: container
          min-versions-to-keep: 6
          ignore-versions: '^untrusted-.*$'
          token: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: fmt · clippy · qmllint
    needs: image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eternalcoder454/atlas-notepad-dev:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TARGET_DIR: target/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restored on every run, saved only from main: a save per pull request
      # would crowd the other caches out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/ci"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Not verified offline: whether qmllint resolves Atlas.Ui and Kirigami from
      # the installed modules and passes on the current QML. Reported but not
      # blocking until a run shows it is clean; then drop continue-on-error.
      # No clang-format step: the repository has no .clang-format.
      - name: qmllint
        run: |
          qmllint=$(command -v qmllint-qt6 || command -v qmllint || echo /usr/lib64/qt6/bin/qmllint)
          if ! out=$("$qmllint" -I /usr/lib64/qt6/qml apps/atlas-notepad/qml/*.qml 2>&1); then
            printf '%s\n' "$out"
            n=$(printf '%s\n' "$out" | grep -ci 'warning\|error' || true)
            echo "::warning::qmllint reported $n warning/error lines (not blocking yet)"
          fi

  check:
    # The name is the old one, so required-check settings keep working; clippy
    # now runs in `lint`.
    name: fmt · clippy · test · ctest
    needs: image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eternalcoder454/atlas-notepad-dev:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TARGET_DIR: target/ci
      CCACHE_COMPRESS: '1'
      CCACHE_MAXSIZE: 300M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/ci"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: cargo fmt --all --check

      # $GITHUB_WORKSPACE, not the workflow context's path: in a container the
      # two differ.
      - name: Set up ccache
        id: ccache-env
        run: |
          {
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >>"$GITHUB_ENV"
          echo "week=$(date -u +%G-W%V)" >>"$GITHUB_OUTPUT"

      # Restored on every run, saved only from main, as the Cargo cache: one
      # entry per run, the newest of this week first, then any week.
      - name: Restore the ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-f44-${{ steps.ccache-env.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            ccache-f44-${{ steps.ccache-env.outputs.week }}-
            ccache-f44-

      - name: cargo test
        run: cargo test --locked --workspace

      - name: CMake build
        run: |
          ccache -z
          cmake -S apps/atlas-notepad -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci
          ccache -s

      - name: ctest
        run: ctest --test-dir build/ci -j4 --output-on-failure

      - name: Save the ccache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-f44-${{ steps.ccache-env.outputs.week }}-${{ github.run_id }}

  # No ccache here: %cmake runs in a fresh mktemp directory and the spec's
  # -ffile-prefix-map=$PWD flags would make most hits miss anyway.
  rpm:
    name: RPM
    needs: image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eternalcoder454/atlas-notepad-dev:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ATLAS_SKIP_DEPS: no installs, so the RPM is built against exactly the
      # image (Atlas.Ui's RPMs are in it, at /opt/atlas-rpms).
      - name: Build the RPM
        run: ATLAS_SKIP_DEPS=1 packaging/build-rpm.sh "$PWD/out/rpm"

      - name: rpmlint
        run: rpmlint out/rpm/*.rpm

      # The package installs, and dnf then refuses to remove it (protected.d).
      - name: Install, then try to remove
        run: |
          dnf -y install out/rpm/atlas-notepad-*.rpm
          rpm -q atlas-notepad
          test -f /etc/dnf/protected.d/atlas-notepad.conf
          if out=$(dnf -y remove atlas-notepad 2>&1); then
            printf '%s\n' "$out"
            echo "dnf removed atlas-notepad: protected.d is not working" >&2
            exit 1
          fi
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'protected packages:.*atlas-notepad'
          rpm -q atlas-notepad

      - name: Upload the RPM (not from pull requests)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-notepad-rpm
          path: out/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
