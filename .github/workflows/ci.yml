name: CI

on:
  push:
    branches: [main]
    paths-ignore: &ignored
      - '**.md'
      - 'docs/**'
      - 'out/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the older run of a branch or pull request, never a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/eternalcoder454/atlas-notepad-dev

# Everything runs in Fedora 44, the release AtlasOS is built on, as scripts/dev.sh
# does locally. Actions are pinned by commit.
#
#   image -> lint -> check
#              `---> rpm
#
# `image` makes sure the build image exists on GHCR (building it, with Atlas.Ui,
# only when its inputs changed), so no job installs packages. `lint` fails fast.

jobs:
  # The tag is a hash of everything the image is made from: the spec (build
  # dependencies), the atlas-framework rev (Atlas.Ui), ci/ (the Containerfile)
  # and the ISO week (Fedora's updates). An existing tag is reused as it is.
  #
  # Pull requests from forks have a read-only token and cannot push. If the
  # image for their tag is missing (they changed the spec, the rev or ci/, or a
  # new week began before any push to main), this job fails with a message; a
  # maintainer re-runs it from a branch of this repository. The package must be
  # public, so those jobs can still pull an image that exists.
  image:
    name: build image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same rev as the crates, so Atlas.Ui and the crash code match.
      - name: Read the atlas-framework rev and compute the tag
        id: tag
        run: |
          url='https://github.com/EternalCoder454/atlas-framework'
          revs=$(sed -n "s|^atlas-framework-[a-z]* = { git = \"$url\", rev = \"\([0-9a-f]\{40\}\)\" }\$|\1|p" Cargo.toml | sort -u)
          crates=$(grep -c '^atlas-framework-' Cargo.toml || true)
          pinned=$(grep -c "^atlas-framework-[a-z]* = { git = \"$url\", rev = \"[0-9a-f]\{40\}\" }\$" Cargo.toml || true)
          if [ "$crates" = 0 ] || [ "$pinned" != "$crates" ] || [ "$(printf '%s\n' "$revs" | wc -l)" != 1 ]; then
            echo "Cargo.toml must pin every atlas-framework crate to $url at one 40-character rev" >&2
            exit 1
          fi
          week=$(date -u +%G-W%V)
          sum=$({ printf '%s\n%s\n' "$revs" "$week"; cat packaging/atlas-notepad.spec; find ci -type f | LC_ALL=C sort | xargs cat; } | sha256sum | cut -c1-16)
          {
            echo "rev=$revs"
            echo "week=$week"
            echo "tag=f44-$sum"
          } >>"$GITHUB_OUTPUT"

      # Not for fork pull requests: the token cannot push, and a public package
      # needs no login to be read.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Does the image exist?
        id: exists
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "found=true" >>"$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG exists"
          else
            echo "found=false" >>"$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG is missing: building it"
          fi

      - name: Fork pull requests cannot build the image
        if: steps.exists.outputs.found != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::The build image $IMAGE:${{ steps.tag.outputs.tag }} does not exist yet and this pull request's token cannot push it. A maintainer must re-run CI from a branch of ${{ github.repository }}."
          exit 1

      # atlas-framework's RPMs, once per rev and week (also when only the spec
      # changed and the image is rebuilt).
      - name: Cache the RPMs
        id: cache
        if: steps.exists.outputs.found != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: framework-rpms
          key: atlas-framework-rpms-f44-${{ steps.tag.outputs.rev }}-${{ steps.tag.outputs.week }}

      - name: Check out atlas-framework
        if: steps.exists.outputs.found != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EternalCoder454/atlas-framework
          ref: ${{ steps.tag.outputs.rev }}
          path: atlas-framework
          persist-credentials: false

      # In a Fedora container, as its build-rpm.sh installs packages as root.
      - name: Build the RPMs
        if: steps.exists.outputs.found != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir framework-rpms
          docker run --rm \
            -v "$PWD/atlas-framework":/src:ro \
            -v "$PWD/framework-rpms":/out \
            registry.fedoraproject.org/fedora:44 \
            /src/packaging/build-rpm.sh /out
          ls -l framework-rpms

      - name: Build and push the image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Containerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  lint:
    name: fmt · clippy · qmllint
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eternalcoder454/atlas-notepad-dev:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TARGET_DIR: target/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restored on every run, saved only from main: a save per pull request
      # would crowd the other caches out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/ci"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Not verified offline: whether qmllint resolves Atlas.Ui and Kirigami from
      # the installed modules and passes on the current QML. Reported but not
      # blocking until a run shows it is clean; then drop continue-on-error.
      # No clang-format step: the repository has no .clang-format.
      - name: qmllint
        continue-on-error: true
        run: |
          qmllint=$(command -v qmllint-qt6 || command -v qmllint || echo /usr/lib64/qt6/bin/qmllint)
          "$qmllint" -I /usr/lib64/qt6/qml apps/atlas-notepad/qml/*.qml

  check:
    name: test · build · ctest
    needs: [image, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eternalcoder454/atlas-notepad-dev:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TARGET_DIR: target/ci
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: '1'
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/ci"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Restored on every run, saved only from main, as the Cargo cache.
      - name: Restore the ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-f44-${{ github.sha }}
          restore-keys: |
            ccache-f44-

      - name: cargo test
        run: cargo test --locked --workspace

      - name: CMake build
        run: |
          ccache -z
          cmake -S apps/atlas-notepad -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci
          ccache -s

      - name: ctest
        run: ctest --test-dir build/ci -j4 --output-on-failure

      - name: Save the ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  # No ccache here: %cmake runs in a fresh mktemp directory and the spec's
  # -ffile-prefix-map=$PWD flags would make most hits miss anyway.
  rpm:
    name: RPM
    needs: [image, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eternalcoder454/atlas-notepad-dev:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Atlas.Ui's RPMs are in the image, outside the checkout so the RPM's
      # source tarball doesn't take them in.
      - name: Build the RPM
        run: ATLAS_LOCAL_RPMS=/opt/atlas-rpms packaging/build-rpm.sh "$PWD/out/rpm"

      - name: rpmlint
        run: rpmlint out/rpm/*.rpm

      # The package installs, and dnf then refuses to remove it (protected.d).
      - name: Install, then try to remove
        run: |
          dnf -y install out/rpm/atlas-notepad-*.rpm
          rpm -q atlas-notepad
          test -f /etc/dnf/protected.d/atlas-notepad.conf
          if out=$(dnf -y remove atlas-notepad 2>&1); then
            printf '%s\n' "$out"
            echo "dnf removed atlas-notepad: protected.d is not working" >&2
            exit 1
          fi
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'protected packages:.*atlas-notepad'
          rpm -q atlas-notepad

      - name: Upload the RPM (not from pull requests)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-notepad-rpm
          path: out/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
