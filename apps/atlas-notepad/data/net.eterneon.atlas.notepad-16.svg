<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 128 128">
  <title>Notepad, 16 px</title>
  <!-- The 128 px icon simplified for 16 px: the page, its coral band and a
       shorter, thicker pencil; two lines instead of three. -->
  <defs>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="40">
      <stop offset="0" stop-color="#FF8C75"/>
      <stop offset="1" stop-color="#EE5A4E"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="118" rx="50" ry="7" fill="url(#shadow)"/>
  <rect x="16" y="14" width="84" height="104" rx="12" fill="#C9D0DC"/>
  <rect x="10" y="8" width="84" height="104" rx="12" fill="#FFFFFF"/>
  <path fill="url(#band)" d="M22 8H82A12 12 0 0 1 94 20V40H10V20A12 12 0 0 1 22 8Z"/>
  <path fill="none" stroke="#B9C0CE" stroke-width="10" stroke-linecap="round" d="M26 62H76M26 84H50"/>
  <g transform="translate(62 112) rotate(-48)">
    <path fill="#F7D7AE" d="M0 0L20 -12V12Z"/>
    <path fill="#3A3550" d="M0 0L8 -5V5Z"/>
    <path fill="#6858E2" d="M20 -12H64V12H20Z"/>
    <path fill="#F49AC1" d="M64 -12H70A8 8 0 0 1 78 -4V4A8 8 0 0 1 70 12H64Z"/>
  </g>
</svg>
