<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Notepad</title>
  <!-- A spiral notepad with a coral cover band, ruled lines and a violet
       pencil. Part of the Telamon app icons: no tile, own hue, same
       corners, light and shadow. -->
  <defs>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="112">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEFF5"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="42">
      <stop offset="0" stop-color="#FF8C75"/>
      <stop offset="1" stop-color="#EE5A4E"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64) scale(1.06) translate(-64 -64)">
    <ellipse cx="64" cy="114" rx="46" ry="6" fill="url(#shadow)"/>
    <rect x="22" y="22" width="76" height="90" rx="10" fill="#C9D0DC"/>
    <rect x="18" y="18" width="76" height="90" rx="10" fill="url(#page)"/>
    <path fill="url(#band)" d="M28 18H84A10 10 0 0 1 94 28V40H18V28A10 10 0 0 1 28 18Z"/>
    <g fill="#454B5A">
      <rect x="31" y="11" width="6" height="16" rx="3"/>
      <rect x="45" y="11" width="6" height="16" rx="3"/>
      <rect x="59" y="11" width="6" height="16" rx="3"/>
      <rect x="73" y="11" width="6" height="16" rx="3"/>
    </g>
    <path fill="none" stroke="#C6CCD8" stroke-width="5" stroke-linecap="round" d="M30 56H82M30 70H82M30 84H62"/>
    <g transform="translate(58 106) rotate(-48)">
      <path fill="#F7D7AE" d="M0 0L16 -8V8Z"/>
      <path fill="#3A3550" d="M0 0L6 -3V3Z"/>
      <path fill="#8A7AF4" d="M16 -8H58V0H16Z"/>
      <path fill="#6858E2" d="M16 0H58V8H16Z"/>
      <rect x="58" y="-8" width="7" height="16" fill="#C9CED9"/>
      <path fill="#F49AC1" d="M65 -8H69A6 6 0 0 1 75 -2V2A6 6 0 0 1 69 8H65Z"/>
    </g>
  </g>
</svg>
