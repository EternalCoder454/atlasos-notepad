[workspace]
resolver = "3"
members = ["crates/notepad-core", "apps/telamon-notepad"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-notepad"
rust-version = "1.89"

[workspace.dependencies]
# atlas-framework: the crash reports. Its Telamon.Ui QML module is not built
# from here: it comes installed (the telamon-ui RPM), like Kirigami. This rev is
# the v2.0.9 tag's commit (CI wants a rev, not a tag). Move it together with
# `telamon-ui >=` in packaging/telamon-notepad.spec (see CLAUDE.md).
telamon-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "cda51cea326fbad492d3328a8d7fb10db737dbfc" }
telamon-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "cda51cea326fbad492d3328a8d7fb10db737dbfc" }

# Property tests (docs/SECURITY.md, "Tests"): a dev-dependency only.
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# The highlighter runs on every keystroke: keep the core fast in dev builds too.
[profile.dev.package.notepad-core]
opt-level = 3
