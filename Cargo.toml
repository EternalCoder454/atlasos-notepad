[workspace]
resolver = "3"
members = ["crates/notepad-core", "apps/atlas-notepad"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-notepad"
rust-version = "1.89"

[workspace.dependencies]
# atlas-framework: the crash reports. Its Atlas.Ui QML module is not built
# from here: it comes installed (the atlas-ui RPM), like Kirigami. This rev is
# atlas-ui 1.2.0; move it together with `atlas-ui >=` in
# packaging/atlas-notepad.spec (see CLAUDE.md). Pin a commit of origin/main.
atlas-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "460e478e39524be9b53f489958f3671edcc684c5" }
atlas-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "460e478e39524be9b53f489958f3671edcc684c5" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# The highlighter runs on every keystroke: keep the core fast in dev builds too.
[profile.dev.package.notepad-core]
opt-level = 3
