# cargo-deny: what may be in the dependency tree of Notepad (docs/SECURITY.md,
# "Build hardening and supply chain"). CI runs `cargo deny check` on every
# change and every week (.github/workflows/security.yml); locally:
#   cargo install --locked cargo-deny && cargo deny check

[graph]
# What the package is built for (Telamon OS images are x86_64 and aarch64
# Fedora); crates only for other systems are not looked at.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
# A known vulnerability, an unmaintained crate or a yanked version in the lock
# file fails the check. Ignore an advisory only with the reason and a date to
# look at it again, in `ignore = [{ id = "RUSTSEC-...", reason = "..." }]`.
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
# Notepad is MIT; these are the licences its dependencies come under.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are common in a tree of this size (the framework's
# dependencies); they are listed, not refused.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Notepad does no networking of its own (KIO does it, in C++): no TLS or
    # HTTP stack comes in through the Rust side, and a second one would be a
    # surprise.
    { crate = "openssl", reason = "Notepad's Rust side does no networking; a TLS library is new attack surface" },
    { crate = "openssl-sys", reason = "see openssl" },
    { crate = "native-tls", reason = "see openssl" },
    { crate = "rustls", reason = "see openssl" },
    { crate = "reqwest", reason = "see openssl" },
    { crate = "ureq", reason = "see openssl" },
    { crate = "hyper", reason = "see openssl" },
]

[sources]
# Only crates.io and the one repository Notepad pins, by commit (see CLAUDE.md,
# "Moving the pin"; ci/check-cargo.py holds the rev).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/EternalCoder454/atlas-framework",
]
